<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Smart Railway Dashboard</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      font-family: 'Poppins', sans-serif;
    }

    body{
      background:
      radial-gradient(circle at top left,#1e293b,#020617);

      min-height:100vh;

      overflow-x:hidden;
    }

    .glass{
      background: rgba(255,255,255,0.08);

      backdrop-filter: blur(18px);

      border:1px solid rgba(255,255,255,0.1);

      box-shadow:
      0 8px 32px rgba(0,0,0,0.3);

      transition:0.3s;
    }

    .glass:hover{
      transform:translateY(-5px) scale(1.02);
    }

    .indicator{
      width:22px;
      height:22px;
      border-radius:50%;
      animation:pulse 1.5s infinite;
    }

    .green{
      background:#22c55e;
      box-shadow:0 0 20px #22c55e;
    }

    .red{
      background:#ef4444;
      box-shadow:0 0 20px #ef4444;
    }

    @keyframes pulse{

      0%{
        transform:scale(1);
        opacity:1;
      }

      50%{
        transform:scale(1.3);
        opacity:0.7;
      }

      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    .train-bg{
      position:fixed;
      top:0;
      left:-400px;

      font-size:100px;

      opacity:0.03;

      animation:trainMove 20s linear infinite;
    }

    @keyframes trainMove{

      from{
        left:-400px;
      }

      to{
        left:120%;
      }
    }

  </style>
</head>

<body class="text-white">

  <!-- Animated Background Train -->
  <div class="train-bg">
    🚆🚃🚃🚃
  </div>

  <div class="max-w-7xl mx-auto px-6 py-10">

    <!-- Header -->

<div class="text-center mb-12">

  <h1 class="text-5xl md:text-6xl font-bold mb-4">
    🚆 Smart Railway
  </h1>

  <p class="text-slate-300 text-lg">
    Real-Time Railway Monitoring System
  </p>

</div>

<!-- NOTIFICATION BUTTON -->

<div class="flex justify-center mt-6 mb-10">

  <button
    id="notifBtn"
    class="px-6 py-3 rounded-2xl bg-blue-500 hover:bg-blue-600 transition text-white font-semibold shadow-lg">

    🔔 Enable Notifications

  </button>

</div>

<!-- CARDS -->

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

    <!-- Top Grid -->

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

      <!-- STATUS -->

      <div class="glass rounded-3xl p-8">

        <div class="flex items-center justify-between">

          <div>
            <p class="text-slate-300 text-sm">
              System Status
            </p>

            <h2
              id="status"
              class="text-3xl font-bold mt-3">
              Loading...
            </h2>
          </div>

          <div class="text-5xl">
            🚦
          </div>

        </div>

      </div>

      <!-- BARRIER -->

      <div class="glass rounded-3xl p-8">

        <div class="flex items-center justify-between">

          <div>

            <p class="text-slate-300 text-sm">
              Barrier State
            </p>

            <h2
              id="barrier"
              class="text-3xl font-bold mt-3">
              Loading...
            </h2>

          </div>

          <div class="text-5xl">
            🚧
          </div>

        </div>

      </div>

      <!-- TRAIN COUNT -->

      <div class="glass rounded-3xl p-8">

        <div class="flex items-center justify-between">

          <div>

            <p class="text-slate-300 text-sm">
              Total Trains
            </p>

            <h2
              id="trainCount"
              class="text-5xl font-bold mt-3">
              0
            </h2>

          </div>

          <div class="text-5xl">
            🚆
          </div>

        </div>

      </div>

      <!-- ARRIVAL -->

      <div class="glass rounded-3xl p-8">

        <p class="text-slate-300 text-sm">
          Train Arrival
        </p>

        <h2
          id="arrivalCountdown"
          class="text-5xl font-bold mt-4">
          -- sec
        </h2>

      </div>

      <!-- LAST TRAIN -->

      <div class="glass rounded-3xl p-8">

        <p class="text-slate-300 text-sm">
          Last Train
        </p>

        <h2
          id="lastTrain"
          class="text-3xl font-bold mt-4">
          Never
        </h2>

      </div>

      <!-- NEXT TRAIN -->

      <div class="glass rounded-3xl p-8">

        <p class="text-slate-300 text-sm">
          Next Train
        </p>

        <h2
          id="nextTrain"
          class="text-3xl font-bold mt-4">
          Waiting...
        </h2>

      </div>

    </div>

    <!-- Bottom Grid -->

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mt-10">

      <!-- LIVE STATE -->

      <div class="glass rounded-3xl p-8">

        <div class="flex items-center justify-between">

          <div>

            <p class="text-slate-300 text-sm">
              Live Railway State
            </p>

            <h2 class="text-3xl font-bold mt-3">
              System Active
            </h2>

          </div>

          <div
            id="liveIndicator"
            class="indicator green">
          </div>

        </div>

      </div>

      <!-- CLOCK -->

      <div class="glass rounded-3xl p-8 text-center">

        <p class="text-slate-300 text-sm">
          Current Time
        </p>

        <h2
          id="clock"
          class="text-5xl font-bold mt-4">
        </h2>

      </div>

    </div>

  </div>

  <!-- APP JS -->
  <script src="app.js"></script>

  <!-- Notification Permission -->
  <script>

    if(Notification.permission !== "granted")
    {
      Notification.requestPermission();
    }

  </script>

</body>
</html>
